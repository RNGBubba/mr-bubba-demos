<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Booking System — Hermes Data Services</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: #e0e0e0;
  min-height: 100vh;
}
header {
  background: rgba(15,12,41,0.9);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 16px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
}
header h1 {
  font-size: 1.3rem;
  background: linear-gradient(120deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
header nav a {
  color: #a0a0c0;
  text-decoration: none;
  margin-left: 20px;
  font-size: 0.9rem;
}
header nav a:hover { color: white; }
.demo-badge {
  display: inline-block;
  background: #ff6b6b;
  color: white;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
  margin-left: 8px;
}
.cta-banner {
  background: linear-gradient(120deg, #667eea, #764ba2);
  color: white;
  text-align: center;
  padding: 10px;
  font-size: 0.95rem;
}
.cta-banner a { color: #ffd700; text-decoration: underline; }
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 20px;
}
.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
}
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 24px;
}
.card h2 {
  font-size: 1.2rem;
  margin-bottom: 16px;
  color: white;
}
.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.calendar-header h3 {
  color: white;
  font-size: 1.1rem;
}
.nav-btn {
  background: rgba(102,126,234,0.2);
  border: 1px solid #667eea;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-btn:hover { background: rgba(102,126,234,0.4); }
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  text-align: center;
}
.day-header {
  color: #a0a0c0;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 8px 0;
}
.day {
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.2s;
}
.day:hover { background: rgba(102,126,234,0.2); }
.day.other-month { color: #555; }
.day.today { background: rgba(102,126,234,0.3); font-weight: 700; }
.day.selected { background: #667eea; color: white; font-weight: 700; }
.day.has-slots::after {
  content: '•';
  display: block;
  color: #2ed573;
  font-size: 1.2rem;
  line-height: 0.5;
}
.day.has-slots.selected::after { color: white; }
.time-slots {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 8px;
}
.time-slot {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.time-slot:hover { border-color: #667eea; background: rgba(102,126,234,0.1); }
.time-slot.selected { border-color: #667eea; background: rgba(102,126,234,0.2); color: white; }
.time-slot.booked { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
.selected-info {
  margin-top: 16px;
  padding: 12px;
  background: rgba(46,213,115,0.1);
  border: 1px solid rgba(46,213,115,0.3);
  border-radius: 8px;
  font-size: 0.9rem;
}
.form-group { margin-bottom: 12px; }
.form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #a0a0c0; }
.form-group input, .form-group select {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 0.9rem;
  outline: none;
}
.book-btn {
  width: 100%;
  background: linear-gradient(120deg, #667eea, #764ba2);
  color: white;
  border: none;
  padding: 14px;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s;
}
.book-btn:hover { opacity: 0.9; }
.book-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.bookings-list {
  margin-top: 24px;
}
.booking-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.booking-item .info { font-size: 0.9rem; }
.booking-item .time { color: #2ed573; font-weight: 600; font-size: 0.85rem; }
.confirmation {
  background: rgba(46,213,115,0.15);
  border: 1px solid #2ed573;
  border-radius: 12px;
  padding: 24px;
  text-align: center;
  display: none;
}
.confirmation.show { display: block; }
.confirmation h3 { color: #2ed573; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="cta-banner">
  🚀 This is a DEMO booking system — <a href="mailto:hello@hermesdataservices.com">Hire me to build your own</a>
</div>

<header>
  <h1>📅 Demo Booking System <span class="demo-badge">DEMO</span></h1>
  <nav>
    <a href="index.html">← Back</a>
    <a href="crm.html">CRM</a>
    <a href="analytics.html">Analytics</a>
    <a href="portal.html">Portal</a>
  </nav>
</header>

<div class="container">
  <div class="layout">
    <div class="card">
      <h2>Select a Date</h2>
      <div class="calendar-header">
        <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
        <h3 id="monthYear"></h3>
        <button class="nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="calendar-grid" id="calendar"></div>
      
      <div id="selectedInfo" class="selected-info" style="display:none;">
        Selected: <strong id="selectedDateDisplay"></strong>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:20px;">
        <h2>Available Times</h2>
        <div id="timeslotContainer">
          <p style="color:#777;text-align:center;padding:20px;">Select a date to see available times</p>
        </div>
      </div>

      <div class="card">
        <h2>Your Details</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="nameInput" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="emailInput" placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label>Service</label>
          <select id="serviceSelect">
            <option value="consultation">Strategy Consultation (30 min)</option>
            <option value="demo">Product Demo (45 min)</option>
            <option value="review">Account Review (60 min)</option>
            <option value="support">Technical Support (30 min)</option>
          </select>
        </div>
        <button class="book-btn" id="bookBtn" disabled onclick="bookAppointment()">Book Appointment</button>
        
        <div class="confirmation" id="confirmation">
          <h3>✅ Booked!</h3>
          <p id="confirmText"></p>
          <button class="book-btn" style="margin-top:12px;" onclick="resetBooking()">Book Another</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card bookings-list">
    <h2>📋 Sample Bookings <span class="demo-badge" style="font-size:0.7rem">DEMO DATA</span></h2>
    <div id="bookingsList"></div>
  </div>
</div>

<script>
let currentDate = new Date();
let selectedDate = null;
let selectedTime = null;

const sampleBookings = [
  { name: 'Sarah J.', time: 'Today, 2:00 PM', service: 'Strategy Consultation' },
  { name: 'Mike C.', time: 'Tomorrow, 10:00 AM', service: 'Product Demo' },
  { name: 'Emily R.', time: 'Sep 18, 3:30 PM', service: 'Account Review' },
  { name: 'David K.', time: 'Sep 19, 11:00 AM', service: 'Technical Support' },
];

const slots = ['9:00 AM', '9:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM', '1:00 PM', '1:30 PM', '2:00 PM', '2:30 PM', '3:00 PM', '3:30 PM', '4:00 PM', '4:30 PM'];
const bookedSlots = ['10:00 AM', '1:30 PM', '3:00 PM']; // Some sample booked slots

function renderCalendar() {
  const cal = document.getElementById('calendar');
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('monthYear').textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
  
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  
  let html = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="day-header">${d}</div>`).join('');
  
  for (let i = 0; i < firstDay; i++) {
    html += '<div class="day other-month"></div>';
  }
  
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
    const isSelected = selectedDate && selectedDate.getFullYear() === year && selectedDate.getMonth() === month && selectedDate.getDate() === d;
    const hasSlots = d % 3 !== 0; // Mock availability
    const classes = ['day'];
    if (isToday) classes.push('today');
    if (isSelected) classes.push('selected');
    if (hasSlots) classes.push('has-slots');
    
    html += `<div class="${classes.join(' ')}" onclick="selectDate(${year}, ${month}, ${d})">${d}</div>`;
  }
  
  cal.innerHTML = html;
}

function changeMonth(delta) {
  currentDate.setMonth(currentDate.getMonth() + delta);
  renderCalendar();
}

function selectDate(year, month, day) {
  selectedDate = new Date(year, month, day);
  selectedTime = null;
  document.getElementById('selectedDateDisplay').textContent = selectedDate.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('selectedInfo').style.display = 'block';
  renderCalendar();
  renderTimeSlots();
  updateBookBtn();
}

function renderTimeSlots() {
  const container = document.getElementById('timeslotContainer');
  if (!selectedDate) return;
  
  container.innerHTML = `<div class="time-slots">${slots.map(s => {
    const isBooked = bookedSlots.includes(s);
    return `<div class="time-slot${isBooked ? ' booked' : ''}"${!isBooked ? ` onclick="selectTime('${s}')"` : ''}>${s}</div>`;
  }).join('')}</div>`;
}

function selectTime(time) {
  selectedTime = time;
  document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('selected'));
  event.target.classList.add('selected');
  updateBookBtn();
}

function updateBookBtn() {
  const name = document.getElementById('nameInput').value;
  const email = document.getElementById('emailInput').value;
  const canBook = selectedDate && selectedTime && name && email;
  document.getElementById('bookBtn').disabled = !canBook;
}

document.getElementById('nameInput').addEventListener('input', updateBookBtn);
document.getElementById('emailInput').addEventListener('input', updateBookBtn);

function bookAppointment() {
  const name = document.getElementById('nameInput').value;
  const service = document.getElementById('serviceSelect').value;
  const serviceNames = { consultation: 'Strategy Consultation', demo: 'Product Demo', review: 'Account Review', support: 'Technical Support' };
  
  bookedSlots.push(selectedTime);
  
  document.getElementById('confirmText').textContent = `${serviceNames[service]} on ${selectedDate.toLocaleDateString()} at ${selectedTime}`;
  document.getElementById('confirmation').classList.add('show');
  document.querySelector('.book-btn').style.display = 'none';
  
  const list = document.getElementById('bookingsList');
  const newBooking = document.createElement('div');
  newBooking.className = 'booking-item';
  newBooking.innerHTML = `<div class="info"><strong>${name}</strong> — ${serviceNames[service]}</div><div class="time">Just now</div>`;
  list.insertBefore(newBooking, list.firstChild);
}

function resetBooking() {
  selectedDate = null;
  selectedTime = null;
  document.getElementById('selectedInfo').style.display = 'none';
  document.getElementById('nameInput').value = '';
  document.getElementById('emailInput').value = '';
  document.getElementById('confirmation').classList.remove('show');
  document.querySelector('.book-btn').style.display = 'block';
  document.getElementById('timeslotContainer').innerHTML = '<p style="color:#777;text-align:center;padding:20px;">Select a date to see available times</p>';
  renderCalendar();
  updateBookBtn();
}

function renderBookingsList() {
  const list = document.getElementById('bookingsList');
  list.innerHTML = sampleBookings.map(b => `
    <div class="booking-item">
      <div class="info"><strong>${b.name}</strong> — ${b.service}</div>
      <div class="time">${b.time}</div>
    </div>
  `).join('');
}

renderCalendar();
renderBookingsList();
</script>

</body>
</html>
