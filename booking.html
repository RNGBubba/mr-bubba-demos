<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Booking System — Mr Bubba Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root { --bg: #000000; --surface: #0a0a0a; --surface-2: #141414; --border: #1f1f1f; --text: #fafafa; --text-2: #888888; --text-3: #555555; --accent: #3b82f6; --accent-2: #22c55e; --accent-3: #fbbf24; --accent-4: #ff6b6b; --radius: 16px; --max-width: 1280px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* Sticky CTA Banner */
.cta-banner-custom {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(135deg, #1e3a5f 0%, #0a1929 50%, #1a0a2e 100%);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 14px 20px;
  text-align: center;
  font-size: 14px;
  color: #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.cta-banner-custom .banner-icon {
  color: #fbbf24;
  font-size: 16px;
}
.cta-banner-custom a {
  color: #fbbf24;
  text-decoration: none;
  font-weight: 600;
  padding: 6px 14px;
  border: 1px solid rgba(251,191,36,0.3);
  border-radius: 6px;
  transition: all 0.2s;
  margin-left: 4px;
}
.cta-banner-custom a:hover {
  background: rgba(251,191,36,0.1);
  border-color: #fbbf24;
  color: #fff;
}

/* Nav */
.nav {
  position: sticky;
  top: 49px;
  z-index: 99;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px 0;
}
.nav-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nav-logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  text-decoration: none;
  letter-spacing: -0.02em;
}
.nav-links {
  display: flex;
  gap: 32px;
  align-items: center;
}
.nav-links a {
  color: var(--text-2);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: color 0.2s;
}
.nav-links a:hover {
  color: var(--text);
}
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 100px;
  background: rgba(255,107,107,0.15);
  color: var(--accent-4);
  border: 1px solid rgba(255,107,107,0.2);
  margin-left: 8px;
}

/* Container */
.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 48px 32px;
}

/* Layout */
.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 24px;
}
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  transition: all 0.3s ease;
}
.card h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 20px;
  letter-spacing: -0.01em;
}

/* Calendar */
.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.calendar-header h3 {
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
}
.nav-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.nav-btn:hover {
  border-color: var(--accent);
  background: rgba(59,130,246,0.1);
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  text-align: center;
}
.day-header {
  color: var(--text-2);
  font-size: 11px;
  font-weight: 600;
  padding: 8px 0;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.day {
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
  color: var(--text-2);
}
.day:hover {
  background: rgba(59,130,246,0.1);
  color: var(--text);
}
.day.other-month {
  color: var(--text-3);
}
.day.today {
  background: rgba(59,130,246,0.15);
  font-weight: 700;
  color: var(--text);
}
.day.selected {
  background: var(--accent);
  color: white;
  font-weight: 700;
}
.day.has-slots::after {
  content: '•';
  display: block;
  color: var(--accent-2);
  font-size: 12px;
  line-height: 0.5;
  margin-top: 2px;
}
.day.has-slots.selected::after { color: white; }

/* Selected info */
.selected-info {
  margin-top: 16px;
  padding: 12px 16px;
  background: rgba(34,197,94,0.05);
  border: 1px solid rgba(34,197,94,0.2);
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-2);
}
.selected-info strong {
  color: var(--accent-2);
}

/* Time slots */
.time-slots {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 8px;
}
.time-slot {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
  color: var(--text-2);
}
.time-slot:hover {
  border-color: var(--accent);
  background: rgba(59,130,246,0.05);
  color: var(--text);
}
.time-slot.selected {
  border-color: var(--accent);
  background: rgba(59,130,246,0.1);
  color: var(--text);
}
.time-slot.booked {
  opacity: 0.4;
  cursor: not-allowed;
  text-decoration: line-through;
}

/* Form */
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  color: var(--text-2);
  font-weight: 500;
}
.form-group input,
.form-group select {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  font-family: 'Inter', sans-serif;
  transition: border-color 0.2s;
}
.form-group input:focus,
.form-group select:focus {
  border-color: var(--accent);
}
.form-group select option {
  background: var(--surface-2);
}

/* Buttons */
.book-btn {
  width: 100%;
  background: var(--text);
  color: var(--bg);
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
}
.book-btn:hover {
  background: #e0e0e0;
}
.book-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  background: var(--surface-2);
  color: var(--text-3);
}

/* Bookings list */
.bookings-list {
  margin-top: 24px;
}
.booking-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.booking-item .info {
  font-size: 14px;
  color: var(--text-2);
}
.booking-item .info strong {
  color: var(--text);
}
.booking-item .time {
  color: var(--accent-2);
  font-weight: 600;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
}

/* Confirmation */
.confirmation {
  background: rgba(34,197,94,0.05);
  border: 1px solid rgba(34,197,94,0.2);
  border-radius: 12px;
  padding: 28px;
  text-align: center;
  display: none;
}
.confirmation.show {
  display: block;
}
.confirmation h3 {
  color: var(--accent-2);
  margin-bottom: 8px;
  font-size: 20px;
}
.confirmation p {
  color: var(--text-2);
}

/* Footer */
.footer {
  border-top: 1px solid var(--border);
  padding: 40px 32px;
  max-width: var(--max-width);
  margin: 0 auto;
  text-align: center;
  color: var(--text-3);
  font-size: 14px;
}
</style>
</head>
<body>

<div class="cta-banner-custom">
  <span class="banner-icon"><i class="fas fa-rocket"></i></span>
  <span>Want a custom web app?</span>
  <a href="https://rngbubba.github.io/mr-bubba-store/" target="_blank" rel="noopener noreferrer">Get a free quote →</a>
</div>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">📅 Demo Booking <span class="badge">DEMO</span></a>
    <div class="nav-links">
      <a href="index.html">← Back</a>
      <a href="crm.html">CRM</a>
      <a href="analytics.html">Analytics</a>
      <a href="portal.html">Portal</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="layout">
    <div class="card">
      <h2>Select a Date</h2>
      <div class="calendar-header">
        <button class="nav-btn" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
        <h3 id="monthYear"></h3>
        <button class="nav-btn" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
      </div>
      <div class="calendar-grid" id="calendar"></div>
      
      <div id="selectedInfo" class="selected-info" style="display:none;">
        Selected: <strong id="selectedDateDisplay"></strong>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:20px;">
        <h2>Available Times</h2>
        <div id="timeslotContainer">
          <p style="color:var(--text-3);text-align:center;padding:20px;">Select a date to see available times</p>
        </div>
      </div>

      <div class="card">
        <h2>Your Details</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="nameInput" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="emailInput" placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label>Service</label>
          <select id="serviceSelect">
            <option value="consultation">Strategy Consultation (30 min)</option>
            <option value="demo">Product Demo (45 min)</option>
            <option value="review">Account Review (60 min)</option>
            <option value="support">Technical Support (30 min)</option>
          </select>
        </div>
        <button class="book-btn" id="bookBtn" disabled onclick="bookAppointment()">Book Appointment</button>
        
        <div class="confirmation" id="confirmation">
          <h3>✅ Booked!</h3>
          <p id="confirmText"></p>
          <button class="book-btn" style="margin-top:12px;" onclick="resetBooking()">Book Another</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card bookings-list">
    <h2>📋 Sample Bookings <span class="badge" style="font-size:10px">DEMO DATA</span></h2>
    <div id="bookingsList"></div>
  </div>
</div>

<div class="footer" style="margin-top: 60px;">
  © 2026 Mr Bubba Services — All demos use sample data
</div>

<script>
let currentDate = new Date();
let selectedDate = null;
let selectedTime = null;

const sampleBookings = [
  { name: 'Sarah J.', time: 'Today, 2:00 PM', service: 'Strategy Consultation' },
  { name: 'Mike C.', time: 'Tomorrow, 10:00 AM', service: 'Product Demo' },
  { name: 'Emily R.', time: 'Sep 18, 3:30 PM', service: 'Account Review' },
  { name: 'David K.', time: 'Sep 19, 11:00 AM', service: 'Technical Support' },
];

const slots = ['9:00 AM', '9:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM', '1:00 PM', '1:30 PM', '2:00 PM', '2:30 PM', '3:00 PM', '3:30 PM', '4:00 PM', '4:30 PM'];
const bookedSlots = ['10:00 AM', '1:30 PM', '3:00 PM'];

function renderCalendar() {
  const cal = document.getElementById('calendar');
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('monthYear').textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
  
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  
  let html = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="day-header">${d}</div>`).join('');
  
  for (let i = 0; i < firstDay; i++) {
    html += '<div class="day other-month"></div>';
  }
  
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
    const isSelected = selectedDate && selectedDate.getFullYear() === year && selectedDate.getMonth() === month && selectedDate.getDate() === d;
    const hasSlots = d % 3 !== 0;
    const classes = ['day'];
    if (isToday) classes.push('today');
    if (isSelected) classes.push('selected');
    if (hasSlots) classes.push('has-slots');
    
    html += `<div class="${classes.join(' ')}" onclick="selectDate(${year}, ${month}, ${d})">${d}</div>`;
  }
  
  cal.innerHTML = html;
}

function changeMonth(delta) {
  currentDate.setMonth(currentDate.getMonth() + delta);
  renderCalendar();
}

function selectDate(year, month, day) {
  selectedDate = new Date(year, month, day);
  selectedTime = null;
  document.getElementById('selectedDateDisplay').textContent = selectedDate.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('selectedInfo').style.display = 'block';
  renderCalendar();
  renderTimeSlots();
  updateBookBtn();
}

function renderTimeSlots() {
  const container = document.getElementById('timeslotContainer');
  if (!selectedDate) return;
  
  container.innerHTML = `<div class="time-slots">${slots.map(s => {
    const isBooked = bookedSlots.includes(s);
    return `<div class="time-slot${isBooked ? ' booked' : ''}"${!isBooked ? ` onclick="selectTime('${s}')"` : ''}>${s}</div>`;
  }).join('')}</div>`;
}

function selectTime(time) {
  selectedTime = time;
  document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('selected'));
  event.target.classList.add('selected');
  updateBookBtn();
}

function updateBookBtn() {
  const name = document.getElementById('nameInput').value;
  const email = document.getElementById('emailInput').value;
  const canBook = selectedDate && selectedTime && name && email;
  document.getElementById('bookBtn').disabled = !canBook;
}

document.getElementById('nameInput').addEventListener('input', updateBookBtn);
document.getElementById('emailInput').addEventListener('input', updateBookBtn);

function bookAppointment() {
  const name = document.getElementById('nameInput').value;
  const service = document.getElementById('serviceSelect').value;
  const serviceNames = { consultation: 'Strategy Consultation', demo: 'Product Demo', review: 'Account Review', support: 'Technical Support' };
  
  bookedSlots.push(selectedTime);
  
  document.getElementById('confirmText').textContent = `${serviceNames[service]} on ${selectedDate.toLocaleDateString()} at ${selectedTime}`;
  document.getElementById('confirmation').classList.add('show');
  document.querySelector('.book-btn').style.display = 'none';
  
  const list = document.getElementById('bookingsList');
  const newBooking = document.createElement('div');
  newBooking.className = 'booking-item';
  newBooking.innerHTML = `<div class="info"><strong>${name}</strong> — ${serviceNames[service]}</div><div class="time">Just now</div>`;
  list.insertBefore(newBooking, list.firstChild);
}

function resetBooking() {
  selectedDate = null;
  selectedTime = null;
  document.getElementById('selectedInfo').style.display = 'none';
  document.getElementById('nameInput').value = '';
  document.getElementById('emailInput').value = '';
  document.getElementById('confirmation').classList.remove('show');
  document.querySelector('.book-btn').style.display = 'block';
  document.getElementById('timeslotContainer').innerHTML = '<p style="color:var(--text-3);text-align:center;padding:20px;">Select a date to see available times</p>';
  renderCalendar();
  updateBookBtn();
}

function renderBookingsList() {
  const list = document.getElementById('bookingsList');
  list.innerHTML = sampleBookings.map(b => `
    <div class="booking-item">
      <div class="info"><strong>${b.name}</strong> — ${b.service}</div>
      <div class="time">${b.time}</div>
    </div>
  `).join('');
}

renderCalendar();
renderBookingsList();
</script>

</body>
</html>
